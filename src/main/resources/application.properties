spring.application.name=Document_chatbot

# .env file se secrets padho (.env git me nahi jaati)
spring.config.import=optional:file:.env[.properties]

# ---------- Database ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Step 2 me Flyway aayega. Tab tak update theek hai (sirf development).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- Admin seed (pehla SUPER_ADMIN) ----------
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
# ---------- Gemini embeddings ----------
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768
app.ai.default-chat-model=${CHAT_MODEL:gemini-2.5-flash}
app.ai.default-embed-model=gemini-embedding-001

# ---------- pgvector ----------
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutes=15
app.jwt.refresh-days=7

# ---------- CORS (frontend ka address, comma se alag) ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ---------- Gemini ----------
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
# ===== Step 4A: ye lines apni application.properties me ADD karo =====

# Chunk size characters me (1 token ~ 4 English chars => 2400 chars ~ 600 tokens, SRS 3.7)
# Hindi-heavy documents ho to chunk-chars=1000, overlap=150 try karo.
app.rag.chunk-chars=2400
app.rag.chunk-overlap-chars=300

# Background ingestion
app.ingestion.threads=2
app.ingestion.embed-batch-size=20
app.ingestion.max-retries=3
app.ingestion.retry-base-ms=2000

# ---------- Upload limit (SRS FR-DOC-02: default 25 MB) ----------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB